<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доступ к аналитическому дашборду</title>
<style>
  :root { --bg:#0b1118; --card:#131b24; --text:#e7edf4; --muted:#9aa9bb; --line:#253241;
          --accent:#2b93c4; --accent-2:#5cc98d; --err:#f07b7b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:radial-gradient(900px 420px at 80% -20%, rgba(43,147,196,.28), transparent 62%), var(--bg);
         font:15px/1.5 "Segoe UI",Calibri,Arial,sans-serif; color:var(--text); }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:30px 28px; box-shadow:0 8px 32px rgba(0,0,0,.4); }
  .brand { display:flex; gap:12px; align-items:center; margin-bottom:20px; }
  .mark { width:42px; height:42px; border-radius:11px; background:linear-gradient(135deg,#2b93c4,#15836f);
          display:grid; place-items:center; font-weight:800; font-size:21px; color:#fff; }
  .brand b { letter-spacing:.14em; font-size:12.5px; }
  .brand span { display:block; font-size:11px; color:var(--muted); }
  h1 { font-size:19px; margin:0 0 6px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  input { width:100%; padding:11px 13px; background:var(--bg); color:var(--text);
          border:1px solid var(--line); border-radius:8px; font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { width:100%; margin-top:12px; padding:11px; background:var(--accent); color:#fff;
           border:0; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:14px; font-size:13px; min-height:20px; }
  .msg.err { color:var(--err); }
  .msg.ok { color:var(--accent-2); }
  .note { margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
          font-size:11.5px; color:var(--muted); }
  #app { display:none; width:100vw; height:100vh; border:0; }
  body.open { padding:0; display:block; background:#fff; }
  body.open .card { display:none; }
  body.open #app { display:block; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="mark">K</div>
    <div><b>KLEY MARKET</b><span>аналитика рынка клеёв-расплавов</span></div>

  <h1>Демонстрационный дашборд</h1>
  <p class="sub">Введите код доступа, чтобы открыть дашборд. Код передаётся отдельно от ссылки.</p>

  <button id="go" type="button">Открыть дашборд</button>

</div>

const ITER = 250000;
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = (text, cls) => { const el = $('msg'); el.textContent = text; el.className = 'msg ' + (cls || ''); };

$('go').addEventListener('click', open);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') open(); });

async function open() {
  const pw = $('pw').value;
  if (!pw) { msg('Введите код доступа', 'err'); return; }
  if (!(window.crypto && crypto.subtle)) {
    msg('Браузер не поддерживает криптографию в этом режиме. Откройте страницу по https- или http://ссылке, а не как локальный файл.', 'err');
    return;
  }
  $('go').disabled = true;
  msg('Проверяем код…');
  try {
    const enc = new TextEncoder();
    const salt = b64(DATA.salt), iv = b64(DATA.iv), ct = b64(DATA.data);
    const material = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
      material, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv, additionalData: enc.encode('kley-demo-v1') }, key, ct);
    const html = new TextDecoder().decode(plain);
    $('app').srcdoc = html;
    document.body.classList.add('open');
    msg('');
  } catch (e) {
    msg('Неверный код доступа или данные повреждены.', 'err');
    $('pw').value = '';
    $('pw').focus();
    $('go').disabled = false;
  }
}
</script>
